<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Cooler status</title>
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Lighting">
			<sdpi-checkbox setting="overlay" label="Draw over the lighting display"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item>
			<details>
				<summary>About this key</summary>
				<p>Shows the liquid cooler's coolant temperature and pump speed. With "Draw over the lighting display" on, the key joins this deck's lighting picture and shows its readout on top of it.</p>
			</details>
		</sdpi-item>
	</body>
</html>
