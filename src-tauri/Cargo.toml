[package]
name = "lightsfanaction"
version = "0.1.0"
description = "Open-source RGB lighting and fan control"
edition = "2021"

[lib]
name = "lightsfanaction_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6.7"
nusb = "0.2.9"
